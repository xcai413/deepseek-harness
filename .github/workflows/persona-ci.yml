name: Persona Runtime CI

on:
  push:
    branches:
      - feature/persona-runtime
  pull_request:
    paths:
      - 'packages/preset/persona-runtime/**'
      - 'packages/client/ui-persona-runtime/**'
      - 'packages/bundle/persona-pack/**'
      - 'pnpm-lock.yaml'
      - 'tsconfig.host.json'
      - 'tsconfig.client.json'
      - '.agents/notes/implemented/architecture/2026-08-18-dynamic-persona-runtime*'
      - '.github/workflows/persona-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persona-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persona-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Synchronize lockfile on feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(persona): sync pnpm lockfile'
          git push origin HEAD:feature/persona-runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Persona packages
        run: |
          pnpm exec tsc -b packages/preset/persona-runtime/tsconfig.json --pretty false
          pnpm exec tsc -b packages/client/ui-persona-runtime/tsconfig.json --pretty false
          pnpm exec tsc -b packages/bundle/persona-pack/tsconfig.json --pretty false

      - name: Bundle Persona client surface
        run: pnpm --filter @deepseek-ai/dsh-client-ui-persona-runtime run bundle

      - name: Run Persona focused tests
        run: >-
          pnpm exec vitest run
          packages/preset/persona-runtime/tests/lane.spec.ts
          packages/preset/persona-runtime/tests/runtime.spec.ts
          packages/preset/persona-runtime/tests/loader-composition.spec.ts
          packages/client/ui-persona-runtime/tests/store.client.spec.ts
