name: Persona UI Composition Once

# One-shot feature-branch migration; delete after the bot composition commit lands.
on:
  push:
    branches:
      - feature/persona-runtime
    paths:
      - '.github/workflows/persona-compose-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/persona-runtime
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Add Persona runtime and UI to Web composition
        shell: python
        run: |
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'anchor not found in {path}: {anchor!r}')
              file.write_text(text.replace(anchor, anchor + addition, 1))

          insert_after(
              'tsconfig.client.json',
              '    { "path": "./packages/client/ui-agent-preset" },\n',
              '    { "path": "./packages/client/ui-persona-runtime" },\n',
          )

          insert_after(
              'tsconfig.host.json',
              '    { "path": "./packages/preset/persona-runtime" },\n',
              '    { "path": "./packages/client/ui-persona-runtime/tsconfig.host.json" },\n',
          )

          insert_after(
              'packages/bundle/web-app/package.json',
              '    "@deepseek-ai/dsh-client-ui-agent-preset": "workspace:^",\n',
              '    "@deepseek-ai/dsh-client-ui-persona-runtime": "workspace:^",\n',
          )
          insert_after(
              'packages/bundle/web-app/package.json',
              '    "@deepseek-ai/dsh-message-feedback": "workspace:^",\n',
              '    "@deepseek-ai/dsh-persona-runtime": "workspace:^",\n',
          )

          insert_after(
              'packages/bundle/web-app/cordis.patch.yml',
              "    - id: message-feedback\n      name: '@deepseek-ai/dsh-message-feedback'\n      config:\n        maxNoteBytes: 8192\n",
              "\n    # Dynamic per-session identity overlay; selection persists outside the Session log.\n    - id: persona-runtime\n      name: '@deepseek-ai/dsh-persona-runtime'\n",
          )
          insert_after(
              'packages/bundle/web-app/cordis.patch.yml',
              "    - id: ui-agent-preset\n      name: '@deepseek-ai/dsh-client-ui-agent-preset'\n",
              "\n    # Live Persona selector and conversation-scoped appearance projection.\n    - id: ui-persona-runtime\n      name: '@deepseek-ai/dsh-client-ui-persona-runtime'\n",
          )

      - name: Synchronize pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit composition update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Composition is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tsconfig.client.json tsconfig.host.json pnpm-lock.yaml \
            packages/bundle/web-app/package.json packages/bundle/web-app/cordis.patch.yml
          git commit -m 'feat(persona-ui): compose runtime into web bundle'
          git push origin HEAD:feature/persona-runtime
