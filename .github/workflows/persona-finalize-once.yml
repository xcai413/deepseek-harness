name: Persona Finalize Once

on:
  push:
    branches:
      - feature/persona-runtime
    paths:
      - '.github/workflows/persona-finalize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/persona-runtime
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Add Persona packages to repository typecheck aggregates
        shell: python
        run: |
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'anchor not found in {path}: {anchor!r}')
              file.write_text(text.replace(anchor, anchor + addition, 1))

          insert_after(
              'tsconfig.client.json',
              '    { "path": "./packages/client/ui-agent-preset" },\n',
              '    { "path": "./packages/client/ui-persona-runtime" },\n',
          )

          insert_after(
              'tsconfig.host.json',
              '    { "path": "./packages/bundle/web-app" },\n',
              '    { "path": "./packages/bundle/persona-pack" },\n',
          )
          insert_after(
              'tsconfig.host.json',
              '    { "path": "./packages/preset/persona" },\n',
              '    { "path": "./packages/preset/persona-runtime" },\n    { "path": "./packages/client/ui-persona-runtime/tsconfig.host.json" },\n',
          )

      - name: Synchronize final lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit aggregate and lockfile update
        shell: bash
        run: |
          if git diff --quiet -- tsconfig.client.json tsconfig.host.json pnpm-lock.yaml; then
            echo 'Persona aggregate references and lockfile are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tsconfig.client.json tsconfig.host.json pnpm-lock.yaml
          git commit -m 'chore(persona): finalize workspace aggregates and lockfile'
          git push origin HEAD:feature/persona-runtime
